spring.application.name=tanormal-api

# No Render a porta vem da variável PORT. Rodando no IntelliJ usa a 8080.
server.port=${PORT:8080}

# Deixa receber JSON sem o campo "id" (o id é gerado pela sequence do Oracle).
# Sem isso, o Spring Boot 4 recusa o corpo do POST porque o id é int.
spring.jackson.deserialization.fail-on-null-for-primitives=false
